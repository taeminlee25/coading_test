<html>

<head>
    <meta charset="UTF-8">
    <title>출력결과</title>
</head>

<body>
    <script>
        /*
        1부터 N까지 번호가 적힌 구슬이 있습니다. 이 중 M개를 뽑는 방법의 수를 출력하는 프로그램을 작성하세요.
        */
        function solution(n, m) {
            let answer = 0
            function DFS(depth, start) {
                if (depth === m) {
                    answer++
                    return
                }
                for (let num = start; num <= n; num++) {
                    DFS(depth + 1, num + 1)
                }

            }
            DFS(0, 1)
            return answer;
        }

        console.log(solution(4, 2));
    </script>
</body>

</html>
