<html>

<head>
    <meta charset="UTF-8">
    <title>출력결과</title>
</head>

<body>
    <script>
        function solution(n) {
            let answer;

            function DFS(L) {
                if (L > 7) return;
                // 전위순회
                // answer += L + " ";
                DFS(L * 2)
                // 중위순회
                // answer += L + " ";
                DFS(L * 2 + 1);
                // 후위순회
                answer += L + " ";
            }

            DFS(1);
            return answer;
        }

        console.log(solution(1));
    </script>
</body>

</html>
