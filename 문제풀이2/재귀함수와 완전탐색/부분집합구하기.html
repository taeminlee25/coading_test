<html>

<head>
    <meta charset="UTF-8">
    <title>출력결과</title>
</head>

<body>
    <script>
        // 자연수 N이 주어지면 1부터 N까지의 원소를 갖는 집합의 부분집합을 모두 출력하는 프로그램을 작성하세요. 
        function solution(n) {
            let answer = [];
            let ch = Array.from({ length: n + 1 }, () => 0);

            function DFS(L) {
                if (L === n + 1) {
                    let tmp = "";
                    for (let i = 1; i <= n; i++) {
                        if (ch[i] === 1) tmp += i + " ";
                    }
                    if (tmp.length > 0) answer.push(tmp.trim());
                    return;
                }
                ch[L] = 1;
                DFS(L + 1);
                ch[L] = 0;
                DFS(L + 1);
            }
            DFS(1);
            return answer;
        }

        console.log(solution(3));
    </script>
</body>

</html>
