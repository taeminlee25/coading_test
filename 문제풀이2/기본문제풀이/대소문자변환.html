<html>

<head>
    <meta charset="UTF-8">
    <title>출력결과</title>
</head>

<body>
    <script>
        /*
        대문자와 소문자가 같이 존재하는 문자열을 입력받아 
        대문자는 소문자로 소문자는 대문자로
        변환하여 출력하는 프로그램을 작성하세요.
        */
        // 문자열은 원시 값
        function solution(s) {
            const result = []
            for (const char of s) {
                if (char >= "A" && char <= "Z") {
                    result.push(char.toLowerCase())
                } else if (char >= "a" && char <= "z") {
                    result.push(char.toUpperCase())
                } else {
                    result.push(char)
                }
            }
            return s
        }

        console.log(solution("StuDY"));
    </script>
</body>

</html>
