<html>

<head>
    <meta charset="UTF-8">
    <title>출력결과</title>
</head>

<body>
    <script>
        /*
        N개의 문자열이 입력되면 그 중 가장 긴 문자열을 출력하는 프로그램을 작성하세요.
        */
        function solution(s) {
            // const lengths = s.map(val => val.length)
            // const max = Math.max(...lengths)
            // return s[lengths.indexOf(max)]
            let longest = s[0]

            for (let i = 1; i < s.length; i++) {
                if (s[i].length > longest.length) {
                    longest = s[i]
                }
            }

            return longest
        }
        let str = ["teacher", "time", "student", "beautiful", "good"];
        console.log(solution(str));
    </script>
</body>

</html>
