<html>

<head>
    <meta charset="UTF-8">
    <title>출력결과</title>
</head>

<body>
    <script>
        /*
        100이하의 자연수 A, B, C를 입력받아 세 수 중 
        가장 작은 값을 출력하는 프로그램을 작성하세요.
        (정렬을 사용하면 안됩니다)
        */
        function solution(a, b, c) {
            let answer;
            answer = Math.min(a, b, c)

            // 반복문 사용 풀이
            const tmp = [a, b, c]
            let min = tmp[0]
            for (let i = 0; i < tmp.length; i++) {
                if (min > tmp[i]) {
                    min = tmp[i]
                }
            }
            answer = min
            return answer;
        }

        console.log(solution(2, 5, 1));
    </script>
</body>

</html>
