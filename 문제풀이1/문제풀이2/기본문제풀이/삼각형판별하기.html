    <script>
        /*
        길이가 서로 다른 A, B, C 세 개의 막대 길이가 주어지면
        이 세 막대로 삼각형을 만들 수 있으면 “YES"를 출력하고,
        만들 수 없으면 ”NO"를 출력한다
        */
        function solution(a, b, c) {
            let answer = "YES"
            // let tmp = [a, b, c]
            // let max = Math.max(...tmp)
            // let maxIndex = tmp.indexOf(max)
            // tmp.splice(maxIndex, 1)
            // if (tmp.reduce((acc, cur) => acc + cur, 0) > max) {
            //     return answer;
            // } else {
            //     answer = "NO"
            // }
            // return answer

            // 모범풀이
            const max = Math.max(a, b, c)
